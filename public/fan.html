<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12th Coach · Fan view</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: var(--surface-2); }
  .stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px 12px; }
  .phone {
    width: 100%; max-width: 400px; height: min(820px, calc(100dvh - 48px)); display: flex; flex-direction: column;
    background: var(--bg); border-radius: 34px; border: 8px solid #141414; overflow: hidden; box-shadow: var(--shadow);
  }
  @media (max-width: 520px) {
    .stage { padding: 0; display: block; }
    .phone { max-width: none; height: 100dvh; border: 0; border-radius: 0; }
    .desk-note { display: none; }
  }
  .desk-note { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .desk-note a { color: var(--ink-2); font-weight: 600; margin: 0 6px; }

  .match-head { background: var(--red-strong); color: #fff; padding: 12px 16px 14px; flex: none; }
  .head-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
  .head-top select {
    margin-left: auto; background: rgba(255, 255, 255, .16); color: #fff; border: 0; border-radius: 8px;
    padding: 6px 8px; font-size: 12px; font-weight: 600; max-width: 190px;
  }
  .head-top select option { color: #141414; }
  .head-top .live-dot { background: #fff; }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 10px; }
  .team { font-weight: 700; font-size: 14px; }
  .team.away { text-align: right; }
  .goals { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; font-weight: 700; }
  .clock .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; }
  .clock .bar i { display: block; height: 100%; background: #fff; width: 0; transition: width .5s linear; }
  .event { margin-top: 8px; font-size: 13px; opacity: .92; min-height: 20px; }

  .scroll { flex: 1; overflow-y: auto; padding: 14px 14px 18px; }
  .bottom-tabs { flex: none; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--line); }
  .bottom-tabs button { border: 0; background: none; min-height: 52px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .bottom-tabs button[aria-selected="true"] { color: var(--red); box-shadow: inset 0 3px 0 var(--red); }

  .moment { background: var(--surface); border-radius: 18px; padding: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .moment.slide { animation: slide .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes slide { from { transform: translateY(40px); opacity: 0; } }
  .moment h2 { font-size: 20px; margin: 8px 0 4px; }
  .countdown { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); }
  .countdown .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--red-soft); overflow: hidden; }
  .countdown .bar i { display: block; height: 100%; background: var(--red); transition: width .5s linear; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 56px; padding: 8px 12px;
    margin-bottom: 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .opt[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
  .opt .letter { width: 30px; height: 30px; border-radius: 8px; color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
  .opt b { display: block; }
  .opt small { color: var(--muted); }
  .why { margin: 6px 0 12px; }
  .idle { text-align: center; padding: 34px 16px; color: var(--muted); }
  .idle b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .points { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--good-soft); color: var(--good-text); font-weight: 700; }
  .points.zero { background: var(--surface-2); color: var(--ink-2); }
  .fair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
  .feed-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; }
  .feed-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .feed-item b { display: block; font-size: 14px; }
  .consent { font-size: 12px; color: var(--muted); margin-top: 12px; }

  .iq { text-align: center; padding: 6px 0 2px; }
  .iq .big { font-size: 56px; font-weight: 800; line-height: 1; }
  .weight-box { display: flex; align-items: center; gap: 12px; }
  .weight-box .x { font-size: 30px; font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; }
  .reward { margin-bottom: 12px; }
  .reward .track { height: 8px; }
  .reward .fill { background: var(--red); }
  .hist { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .hist:last-child { border-bottom: 0; }
  .hist .pts { margin-left: auto; font-weight: 800; white-space: nowrap; }
  .phone .card { margin-bottom: 12px; padding: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="phone">
      <header class="match-head">
        <div class="head-top">
          <span class="live-dot" id="live-dot"></span><span id="status-text">Not started</span>
          <select id="persona" aria-label="Choose demo fan">
            <option value="season">Season-ticket holder</option>
            <option value="occasional">Occasional visitor</option>
            <option value="remote">Remote fan abroad</option>
          </select>
        </div>
        <div class="score">
          <div class="team" id="home-name">FC Bayern</div>
          <div class="goals" id="goals">0 : 0</div>
          <div class="team away" id="away-name">SV Nordhafen</div>
        </div>
        <div class="clock"><span id="minute">0'</span><div class="bar"><i id="clock-bar"></i></div><span>90'</span></div>
        <div class="event" id="event"></div>
      </header>
      <main class="scroll" id="view-match">
        <div id="moment-slot"></div>
        <div id="feed"></div>
      </main>
      <main class="scroll" id="view-profile" hidden></main>
      <nav class="bottom-tabs" role="tablist">
        <button role="tab" id="tab-match" aria-selected="true">Match</button>
        <button role="tab" id="tab-profile" aria-selected="false">My Fan IQ</button>
      </nav>
    </div>
    <p class="desk-note">Fan view · <a href="/">About</a><a href="/club">Club dashboard</a><a href="/operator">Operator</a></p>
  </div>
</div>
<script src="/common.js"></script>
<script src="/fan.js"></script>
</body>
</html>
